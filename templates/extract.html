{% extends 'base.html' %}

{% block title %}
ColorExtractor | Extract
{% endblock %}

{% block content %}
    <form action="{{ url_for('extract') }}" method="POST" enctype="multipart/form-data">
        <label for="k" class="mt-3 ms-3 me-3">Please, enter que number of colors to be extracted</label>
        <input type="text" id="k" name="k" required="true"><br><br>
        <label for="upload" class="mt-3 mb-3 ms-3 me-3"> Upload to extract </label>
        <input type="file" id="upload" name="image" required="true" class="me-3">
        <input type="submit" value="upload & extract">
        <!-- <button type="submit" name='action' value="upload & extract">upload & extract</button> -->
    </form>

    {% if upload %}
    <div class="container">
        <div class="row">
            <div class="col">
                <img src="./static/uploads/{{ filename }}" class="rounded float-left img-fluid">
            </div>
            <div class="col d-flex align-items-center justify-content-center">
                <img src="./static/extract/{{ filename }}" class="rounded float-left img-fluid">
            </div>
        </div>
    </div>
    {% endif %}

{% endblock %}
